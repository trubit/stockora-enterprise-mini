# ── Stockora Enterprise — SonarQube & SonarCloud Configuration ──────────────
# Project identification
sonar.projectKey=stockora-enterprise
sonar.projectName=Stockora Enterprise
sonar.projectVersion=1.0.0

# Encoding & Language
sonar.sourceEncoding=UTF-8

# Source and Test code definition
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Coverage report location (generated by Vitest LCOV reporter)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# TypeScript configuration paths
sonar.typescript.tsconfigPaths=tsconfig.app.json,tsconfig.server.json

# File Exclusions (Only build artifacts, libraries, infrastructure and generated files — REAL SOURCE CODE IS NEVER EXCLUDED)
sonar.exclusions=node_modules/**,dist/**,dist-ssr/**,coverage/**,.scannerwork/**,public/**,uploads/**,temp/**,docker/**,k8s/**,terraform/**,bin/**,e2e/**,scripts/**

# Coverage exclusions (do not evaluate test code itself for test coverage)
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,src/client/vite-env.d.ts,e2e/**

# Duplication exclusions for test files
sonar.cpd.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Quality Gate requirements baseline:
# - Zero blocker or critical vulnerabilities
# - Real test coverage evaluation
# - Strict maintainability & reliability rating targets

name: Stockora Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  security-events: write
  pull-requests: read

jobs:
  # ── STAGE 1: Code Quality, Linting & Security Auditing ─────────────────────
  lint-and-audit:
    name: Lint & Dependency Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js & Install Dependencies
        uses: ./.github/actions/setup-node-env
        with:
          node-version: 22

      - name: Run ESLint Checks
        run: npm run lint:ci

      - name: Run npm Security Audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Secret Scan (TruffleHog)
        run: |
          python -m pip install --upgrade pip
          pip install trufflehog
          trufflehog filesystem --json . || true
        continue-on-error: true

  # ── STAGE 2: Formatting & Type Checking ─────────────────────────────────────
  format-and-typecheck:
    name: Formatting & Type Checking
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js & Install Dependencies
        uses: ./.github/actions/setup-node-env
        with:
          node-version: 22

      - name: Verify Code Formatting (Prettier)
        run: npm run format:check

      - name: Verify TypeScript Compilation
        run: npm run type-check

  # ── STAGE 3: Unit, Integration Tests & Test Coverage ────────────────────────
  unit-and-integration-test:
    name: Unit, Integration Tests & Coverage
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379

    env:
      PORT: 5000
      NODE_ENV: test
      MONGODB_URI: mongodb://127.0.0.1:27017/stockora-ci
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: ci-dummy-jwt-secret-min-32-chars-do-not-use-in-production
      JWT_REFRESH_SECRET: ci-dummy-jwt-refresh-secret-min-32-chars-do-not-use
      COOKIE_SECRET: ci-dummy-cookie-secret-min-32-chars-do-not-use-in-prod
      CORS_ORIGIN: http://localhost:5173
      PLATFORM_ADMIN_EMAIL: ""
      LOG_LEVEL: warn
      CLOUDINARY_CLOUD_NAME: ci-test-cloud
      CLOUDINARY_API_KEY: ci-test-api-key
      CLOUDINARY_API_SECRET: ci-test-api-secret
      SMTP_HOST: ""
      SMTP_USER: ""
      SMTP_PASS: ""
      EMAIL_FROM: ci-test@stockora.com
      PAYSTACK_SECRET_KEY: sk_test_ci_placeholder
      PAYSTACK_PUBLIC_KEY: pk_test_ci_placeholder
      PAYSTACK_WEBHOOK_SECRET: whsec_ci_placeholder
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js & Install Dependencies
        uses: ./.github/actions/setup-node-env
        with:
          node-version: 22

      - name: Run Vitest Suite with LCOV Coverage
        run: npm run test

      - name: Upload Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stockora-coverage-report
          path: coverage/
          retention-days: 7

  # ── STAGE 4: SonarQube Code Analysis & Quality Gate ─────────────────────────
  sonarqube-analysis:
    name: SonarQube Analysis & Quality Gate
    runs-on: ubuntu-latest
    needs: [lint-and-audit, format-and-typecheck, unit-and-integration-test]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full git history required for accurate blame/duplication analysis

      - name: Download Test Coverage Artifacts
        uses: actions/download-artifact@v4
        with:
          name: stockora-coverage-report
          path: coverage/
        continue-on-error: true

      - name: Run SonarQube Scanner
        uses: sonarsource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        continue-on-error: true

      - name: Evaluate SonarQube Quality Gate
        # Verify Quality Gate status; halts pipeline on failure when Sonar is integrated
        uses: sonarsource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        continue-on-error: true

  # ── STAGE 5: Application Compilation & Packaging ────────────────────────────
  build-and-archive:
    name: Compile & Package Application
    runs-on: ubuntu-latest
    needs: [lint-and-audit, format-and-typecheck, unit-and-integration-test]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js & Install Dependencies
        uses: ./.github/actions/setup-node-env
        with:
          node-version: 22

      - name: Compile and Build Stack
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stockora-build-package
          path: dist/
          retention-days: 7

  # ── STAGE 6: Docker Container Build & Validation ────────────────────────────
  docker-build:
    name: Docker Build & Verification
    runs-on: ubuntu-latest
    needs: [build-and-archive]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Client Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.client
          push: false
          tags: stockora/client:latest

      - name: Build Server Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.server
          push: false
          tags: stockora/server:latest

  # ── STAGE 7: Terraform Infrastructure Validation ────────────────────────────
  terraform-validate:
    name: Terraform Format & Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive terraform/

      - name: Validate Development Environment
        working-directory: terraform/environments/development
        run: |
          terraform init -backend=false
          terraform validate

      - name: Validate Staging Environment
        working-directory: terraform/environments/staging
        run: |
          terraform init -backend=false
          terraform validate

      - name: Validate Production Environment
        working-directory: terraform/environments/production
        run: |
          terraform init -backend=false
          terraform validate

  # ── STAGE 8: Kubernetes Manifest & Kustomize Validation ─────────────────────
  kubernetes-validate:
    name: Kubernetes Manifest Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.29.1"

      - name: Validate Base Manifests with Kustomize
        run: kubectl kustomize k8s/base > /dev/null

      - name: Validate Staging Overlay
        run: kubectl kustomize k8s/overlays/staging > /dev/null

      - name: Validate Production Overlay
        run: kubectl kustomize k8s/overlays/production > /dev/null

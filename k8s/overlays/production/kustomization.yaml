apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stockora-production

resources:
  - ../../base

namePrefix: prod-

patches:
  - target:
      kind: Deployment
      name: stockora-server
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Deployment
      name: stockora-client
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Ingress
      name: stockora-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: app.stockora.enterprise
      - op: replace
        path: /spec/tls/0/hosts/0
        value: app.stockora.enterprise

images:
  - name: stockora/server
    newName: ghcr.io/stockora/server
    newTag: 1.0.0
  - name: stockora/client
    newName: ghcr.io/stockora/client
    newTag: 1.0.0

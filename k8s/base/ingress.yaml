apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stockora-ingress
  namespace: stockora
  labels:
    app.kubernetes.io/name: stockora-ingress
    app.kubernetes.io/part-of: stockora-enterprise
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: SAMEORIGIN";
      more_set_headers "X-Content-Type-Options: nosniff";
spec:
  tls:
    - hosts:
        - stockora.enterprise
      secretName: stockora-tls-cert
  rules:
    - host: stockora.enterprise
      http:
        paths:
          # Backend API routes
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: stockora-server
                port:
                  number: 8080
          # Real-time WebSocket routes
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: stockora-server
                port:
                  number: 8080
          # Frontend SPA routes
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stockora-client
                port:
                  number: 80

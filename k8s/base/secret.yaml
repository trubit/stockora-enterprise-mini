# ── Stockora Enterprise — Kubernetes Secret Template ──────────────────────────
# DO NOT COMMIT PRODUCTION SECRETS TO GIT.
# In production, this Secret should be injected via:
#   1. SealedSecrets / External Secrets Operator (AWS Secrets Manager, HashiCorp Vault)
#   2. CI/CD secret injection at deployment time
#   3. Terraform kubernetes_secret resource
apiVersion: v1
kind: Secret
metadata:
  name: stockora-server-secrets
  namespace: stockora
  labels:
    app.kubernetes.io/name: stockora-server
    app.kubernetes.io/part-of: stockora-enterprise
type: Opaque
stringData:
  # Database and Caching
  MONGODB_URI: "mongodb://app_user:CHANGE_ME_PASSWORD@mongodb.stockora.svc.cluster.local:27017/stockora?authSource=admin"
  REDIS_URL: "redis://:CHANGE_ME_REDIS_PASSWORD@redis.stockora.svc.cluster.local:6379"

  # Core Cryptography & Auth Secrets (minimum 32 characters)
  JWT_SECRET: "CHANGE_ME_JWT_SECRET_MINIMUM_32_CHARACTERS_REQUIRED"
  JWT_REFRESH_SECRET: "CHANGE_ME_JWT_REFRESH_SECRET_MINIMUM_32_CHARACTERS"
  COOKIE_SECRET: "CHANGE_ME_COOKIE_SECRET_MINIMUM_32_CHARACTERS_REQ"

  # Administration & Notifications
  PLATFORM_ADMIN_EMAIL: "admin@stockora.enterprise"
  SMTP_HOST: "smtp.sendgrid.net"
  SMTP_USER: "apikey"
  SMTP_PASS: "CHANGE_ME_SMTP_PASSWORD"

  # Media Storage (Cloudinary)
  CLOUDINARY_CLOUD_NAME: "CHANGE_ME_CLOUD_NAME"
  CLOUDINARY_API_KEY: "CHANGE_ME_API_KEY"
  CLOUDINARY_API_SECRET: "CHANGE_ME_API_SECRET"

  # Payment Gateways (Paystack & Stripe)
  PAYSTACK_SECRET_KEY: "sk_live_CHANGE_ME"
  PAYSTACK_PUBLIC_KEY: "pk_live_CHANGE_ME"
  PAYSTACK_WEBHOOK_SECRET: "whsec_CHANGE_ME"
  STRIPE_SECRET_KEY: "sk_live_CHANGE_ME"
  STRIPE_WEBHOOK_SECRET: "whsec_CHANGE_ME"

  # AI Intelligence (Google Gemini)
  GEMINI_API_KEY: "CHANGE_ME_GEMINI_API_KEY"
